<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Resume - Carden Taylor</title>
  <style>
    * {
      box-sizing: border-box;
    }
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      background-color: #2b2f36;
      font-family: Arial, Helvetica, sans-serif;
    }
    .page-container {
      display: flex;
      flex-direction: column;
      height: 100vh;
    }
    header {
      background-color: #0b3d91;
      border-bottom: 3px solid #fc3d21;
      padding: 10px 16px;
      flex-shrink: 0;
    }
    header a {
      color: #ffffff;
      text-decoration: none;
      font-weight: bold;
      font-size: 14px;
    }
    header a:hover {
      text-decoration: underline;
    }
    .pdf-frame {
      flex: 1;
      width: 100%;
      height: 100%;
      border: none;
      display: block;
    }
  </style>
</head>
<body>
  <div class="page-container">
    <header>
      <a href="index.html">&larr; Main Page</a>
    </header>
    <iframe class="pdf-frame" src="resume.pdf" title="Resume PDF"></iframe>
  </div>
</body>
</html>
